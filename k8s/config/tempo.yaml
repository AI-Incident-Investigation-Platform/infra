stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
  log_format: json
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
live_store:
  max_live_traces_bytes: 33554432
  max_block_bytes: 8388608
  complete_block_concurrency: 1
querier:
  max_concurrent_queries: 2
backend_worker:
  compaction:
    max_block_bytes: 33554432
    retention_concurrency: 1
backend_scheduler:
  provider:
    compaction:
      max_input_blocks: 2
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
overrides:
  defaults:
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: [span-metrics, service-graphs]
usage_report:
  reporting_enabled: false
