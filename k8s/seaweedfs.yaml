apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9327"
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -ip=$(POD_IP)
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=1024
            - -volume.max=100
            - -s3
            - -s3.port=8333
            - -metricsPort=9327
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: infra, key: S3_ROOT_ACCESS_KEY }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: infra, key: S3_ROOT_SECRET_KEY }
          ports:
            - name: master
              containerPort: 9333
            - name: master-grpc
              containerPort: 19333
            - name: filer
              containerPort: 8888
            - name: s3
              containerPort: 8333
            - name: metrics
              containerPort: 9327
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: master
      port: 9333
      targetPort: master
    - name: master-grpc
      port: 19333
      targetPort: master-grpc
    - name: filer
      port: 8888
      targetPort: filer
    - name: s3
      port: 8333
      targetPort: s3
