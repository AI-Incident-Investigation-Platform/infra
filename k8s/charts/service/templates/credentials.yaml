{{- $name := include "service.name" . }}
{{- $p := .Values.platform }}
{{- $existing := (lookup "v1" "Secret" $p.namespace (printf "svc-%s" $name)).data | default dict }}
{{- $password := get $existing "password" | b64dec | default (randAlphaNum 32) }}
{{- $cache := (lookup "v1" "Secret" $p.namespace $p.cache.secret).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: svc-{{ $name }}
  namespace: {{ $p.namespace }}
  labels: {{- include "service.labels" . | nindent 4 }}
  annotations: {{- include "service.hook" -20 | nindent 4 }}
stringData:
  password: {{ $password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-credentials
  labels: {{- include "service.labels" . | nindent 4 }}
  annotations:
    {{- include "service.hook" -20 | nindent 4 }}
    helm.sh/hook-delete-policy: before-hook-creation
stringData:
  {{- if .Values.postgres }}
  DATABASE__POSTGRES_HOST: {{ $p.postgres.host | quote }}
  DATABASE__POSTGRES_PORT: "5432"
  DATABASE__POSTGRES_DB: {{ $name | quote }}
  DATABASE__POSTGRES_USERNAME: {{ $name | quote }}
  DATABASE__POSTGRES_PASSWORD: {{ $password | quote }}
  {{- end }}
  {{- if .Values.s3 }}
  S3__ENDPOINT_URL: {{ $p.s3.endpoint | quote }}
  S3__ACCESS_KEY: {{ $name | quote }}
  S3__SECRET_KEY: {{ $password | quote }}
  S3__BUCKET: {{ $name | quote }}
  S3__REGION: us-east-1
  {{- end }}
  {{- if .Values.cache }}
  CACHE__URL: {{ printf "redis://default:%s@%s:6379/0" (get $cache "password" | b64dec) $p.cache.host | quote }}
  CACHE__KEY_PREFIX: {{ printf "%s:" $name | quote }}
  {{- end }}
