{{- if .Values.route.enabled }}
{{- $g := .Values.platform.gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.name" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs: [{ name: {{ $g.name }}, namespace: {{ $g.namespace }} }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: {{ .Values.route.path | quote }} } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } }
      backendRefs: [{ name: {{ include "service.name" . }}, port: 80 }]
{{- end }}
