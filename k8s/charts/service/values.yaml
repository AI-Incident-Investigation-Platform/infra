image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

port: 8000
replicas: 2
command: []
env: {}

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

healthPath: /health

route:
  enabled: false
  path: ""

autoscaling:
  enabled: false
  min: 2
  max: 10
  cpu: 70

migrations: []

postgres: false
s3: false
cache: false

platform:
  namespace: data
  postgres:
    host: pg-rw.data.svc
    superuserSecret: pg-superuser
    image: postgres:18.6-alpine
  s3:
    endpoint: http://seaweedfs-all-in-one.data.svc:8333
    master: seaweedfs-all-in-one.data.svc:9333
    image: chrislusf/seaweedfs:4.48
  cache:
    host: cache.data.svc
    secret: cache-auth
  gateway:
    name: main
    namespace: gateway
