apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonfly
spec:
  serviceName: dragonfly
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly
  template:
    metadata:
      labels:
        app: dragonfly
    spec:
      containers:
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
          args:
            - --cache_mode=true
            - --maxmemory=512mb
            - --proactor_threads=2
            - --dir=/data
          env:
            - name: DFLY_requirepass
              valueFrom:
                secretKeyRef: { name: infra, key: DRAGONFLY_PASSWORD }
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$DFLY_requirepass\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly
spec:
  type: NodePort
  selector:
    app: dragonfly
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: 30379
