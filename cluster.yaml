apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: aiip
servers: 1
agents: 0
image: rancher/k3s:v1.34.1-k3s1
kubeAPI:
  hostIP: 127.0.0.1
  hostPort: "6443"
ports:
  - port: 127.0.0.1:80:80
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:443:443
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      - arg: --kube-controller-manager-arg=horizontal-pod-autoscaler-sync-period=5s
        nodeFilters: [server:*]
