name: AIIP

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - log_min_duration_statement=500ms
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    restart: unless-stopped
    command:
      - --cache_mode=true
      - --maxmemory=512mb
      - --proactor_threads=2
      - --dir=/data
    environment:
      DFLY_requirepass: ${DRAGONFLY_PASSWORD}
    volumes:
      - dragonfly_data:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:6379:6379"
    ulimits:
      memlock: -1
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$DFLY_requirepass\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=100
      - -s3
      - -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:8333:8333"
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  consul:
    image: hashicorp/consul:2.0.4
    restart: unless-stopped
    command:
      - agent
      - -server
      - -bootstrap-expect=1
      - -ui
      - -client=0.0.0.0
      - -data-dir=/consul/data
      - -node=consul
    volumes:
      - consul_data:/consul/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:8500:8500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "consul members >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  postgres_data:
  dragonfly_data:
  seaweedfs_data:
  consul_data:
